name: Build, test and publish IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      simulator_only:
        description: Run simulator tests and previews without packaging an IPA
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: piliplus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.simulator_only) }}

jobs:
  prioritize-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Release runners occupied by superseded dependency builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_ids="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&per_page=100" --jq '
            .workflow_runs[]
            | select(.name == "Build, test and publish IPA")
            | select(.actor.login == "dependabot[bot]")
            | select(.head_branch | startswith("dependabot/github_actions/"))
            | select(.status == "in_progress" or .status == "queued" or .status == "pending")
            | .id')"
          for run_id in $run_ids; do
            if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel"; then
              echo "::warning::Could not cancel dependency run ${run_id}; it may already have finished."
            fi
          done

  test:
    # Dependency-only bot PRs can be tested with a manual run; main/tag builds always run the full gate.
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select Xcode
        run: bash Scripts/select-xcode.sh
      - name: Test playback policy
        run: swift test --package-path Packages/PiliPlaybackCore
      - name: Validate repository
        run: python3 Scripts/validate-project.py
      - name: Build iOS test bundle
        run: bash Scripts/test-ios.sh build
      - name: Run iOS tests
        run: bash Scripts/test-ios.sh run
      - name: Capture native interface previews
        run: bash Scripts/capture-preview.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PiliPlusSwift-previews-${{ github.run_number }}
          path: dist/preview-*.png
          if-no-files-found: error
      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: iOS-test-results
          path: build/tests/*.xcresult
          if-no-files-found: ignore

  build:
    if: (github.event_name != 'pull_request' || github.actor != 'dependabot[bot]') && (github.event_name != 'workflow_dispatch' || !inputs.simulator_only)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select Xcode
        run: bash Scripts/select-xcode.sh
      - name: Validate repository
        run: python3 Scripts/validate-project.py
      - name: Build unsigned IPA
        run: bash Scripts/build-ipa.sh
      - name: Include license and source provenance
        run: |
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          cp -R Licenses dist/
          find build -path '*/swiftpm/Package.resolved' -exec cp '{}' dist/Package.resolved \; -quit
          if [ -f bili.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved ]; then
            cp bili.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved dist/Package.resolved
          fi
          git rev-parse HEAD > dist/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PiliPlusSwift-unsigned-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
  release:
    needs: [test, build]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: PiliPlusSwift-unsigned-${{ github.run_number }}
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: PiliPlusSwift-previews-${{ github.run_number }}
          path: dist
      - name: Publish tested build
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          if [ "$REF_TYPE" = tag ]; then tag="$REF_NAME"; fi
          git archive --format=tar.gz --output=dist/PiliPlusSwift-source.tar.gz "$GITHUB_SHA"
          tar -czf dist/ThirdParty-Licenses.tar.gz -C dist Licenses
          rm -r dist/Licenses
          cat > release-notes.txt <<'NOTES'
          Swift 6 / AVPlayer 原生客户端，蓝色主题与 iOS Liquid Glass 界面。
          应用与测试已切换 Swift 6 语言模式，媒体导出的取消路径采用明确隔离与单任务所有权。
          已接入播放工具、动态/评论/消息、AU 音频、空间/收藏及离线投屏等业务。
          逐项范围、平台差异和验证记录见 docs/PILIPLUS_FULL_ALIGNMENT.md 与 docs/PILIPLUS_FEATURE_INVENTORY.md。
          Swift 性能优化依据与待真机采样项目见 docs/SWIFT_PERFORMANCE_AUDIT.md。
          本构建已通过自动化测试与设备 Release 编译，线上账号与真机功能仍待验收。
          IPA 未签名，需要自行签名安装；不需要在构建中提供个人证书。
          附带对应源代码、GPL-3.0 许可证和 SHA-256 校验值。
          NOTES
          gh release create "$tag" dist/* --target "$GITHUB_SHA" \
            --title "PiliPlus Swift ${tag}" --notes-file release-notes.txt --prerelease
